name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/Banking.UnitTests/Banking.UnitTests.csproj --configuration Release --no-build

      - name: Architecture tests
        run: dotnet test tests/Banking.ArchitectureTests/Banking.ArchitectureTests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/Banking.IntegrationTests/Banking.IntegrationTests.csproj --configuration Release --no-build

      - name: Docker compose build
        run: docker compose build

